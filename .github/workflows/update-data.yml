name: Update power data

on:
  schedule:
    - cron: "23 * * * *"   # hourly
  workflow_dispatch:
  push:
    branches: [redesign]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch grid data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          DEBUG: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python -u scripts/fetch_power.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/power.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh grid data"
            git pull --rebase --autostash || true
            git push
          fi
